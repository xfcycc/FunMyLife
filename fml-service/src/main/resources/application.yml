# FunMyLife 轻量后端服务配置
# 独立于 RuoYi admin-service，使用独立 fml 数据库

server:
  port: 8082

spring:
  # 未匹配的路径抛出异常（由 GlobalExceptionHandler 处理 404/405）
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # 数据库连接 — 通过环境变量覆盖，默认值仅供本地开发
  datasource:
    url: jdbc:mysql://localhost:3306/fml?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${FML_DB_USERNAME:root}
    password: ${FML_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # 下划线转驼峰（lm_project.project_id → projectId）
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
